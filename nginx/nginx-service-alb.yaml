apiVersion: v1 
kind: Service
metadata:
  name: nginx-service-alb
  annotations: 
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"
    service.beta.kubernetes.io/aws-load-balancer-name: "nginx-alb"
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports: 
    - protocol: TCP
      port: 80
      targetPort: 80