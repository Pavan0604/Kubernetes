apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: nginx
          resources:
            limits:
              cpu: "200"
              memory: "256Mi"
            requests:
              cpu: "100"
              memory: "128Mi"
  strategy:
    type: RollingUpdate
    rollingUpdate: 
      maxSurge: 1
      maxUnavailable: 1
