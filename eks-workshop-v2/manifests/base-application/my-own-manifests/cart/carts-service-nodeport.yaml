apiVersion: v1
kind: Service
metadata:
  name: carts-nodeport-service
  labels:
    app.kubernetes.io/created-by: eks-workshop
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: http
      nodePort: 30006
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: carts
    app.kubernetes.io/instance: carts
    app.kubernetes.io/component: service