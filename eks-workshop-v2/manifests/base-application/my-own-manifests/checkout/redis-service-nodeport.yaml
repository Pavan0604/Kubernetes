apiVersion: v1 
kind: Service
metadata:
  name:  checkout-redis-nodeport
  labels: 
    app.kubernetes.io/created-by: eks-workshop
spec:
  type: NodePort 
  ports:
    - port: 6379
      targetPort: redis
      nodePort: 30010
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/instance: checkout
    app.kubernetes.io/component: redis