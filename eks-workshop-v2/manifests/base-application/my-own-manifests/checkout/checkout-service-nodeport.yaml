apiVersion: v1 
kind: Service
metadata:
  name: checkout-nodeport
  labels:
    app.kubernetes.io/created-by: eks-workshop
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: http
      nodePort: 30011
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/instance: checkout
    app.kubernetes.io/component: service